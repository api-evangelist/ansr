name: ANSR
description: >-
  ANSR Global is a workforce and operations company that helps enterprises build, manage, and scale
  Global Capability Centers (GCCs) — captive technology and shared-services hubs, most often in India
  and other emerging markets. Its end-to-end offering spans four areas: Talent Solutions (AI-driven
  recruiting, sourcing, onboarding, and talent management), Workspace (managed, customized office space
  and workplace strategy), Business Operations (payroll, HR, employer-of-record, compliance, legal, and
  finance/tax), and Research & Advisory (organizational design, capability planning, and market
  intelligence). ANSR engages clients through Global Capability Center subscriptions,
  Build-Operate-Transfer arrangements, and Managed Teams, and operates a proprietary workforce platform,
  1Wrk. The company reports 20+ years of operations, 210+ global centers established, 225,000+
  professionals hired, and 14M+ square feet of managed workspace. ANSR is a portfolio company of Accel.
  It is a business-services provider and does not publish a public API, developer portal, or developer
  documentation; this profile captures its public web surface and web-domain security posture.
